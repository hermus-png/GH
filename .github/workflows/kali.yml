name: Kali Web (noVNC + Cloudflare Tunnel)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  kali-web:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Kali web env
        run: |
          chmod +x ./start.sh
          ./start.sh